{% extends "base.html" %}
{% block title %}Login - Family Tree{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-sm border border-gray-50">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🌳</div>
      <h1 class="text-2xl font-bold text-wmblue-100">Family Tree Dashboard</h1>
      <p class="text-gray-100 mt-1 text-sm">Enter the family PIN to continue</p>
    </div>
    {% if error %}
    <div class="bg-red-50 border border-wmred-100 text-wmred-100 rounded-lg px-4 py-2 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <input type="password" name="pin" placeholder="PIN" required autofocus
        class="w-full border border-gray-50 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-wmblue-100 text-center text-lg tracking-widest">
      <button type="submit"
        class="w-full bg-wmblue-100 hover:bg-wmblue-110 text-white font-semibold py-2 rounded-lg transition">
        Enter
      </button>
    </form>
  </div>
</div>
{% endblock %}
