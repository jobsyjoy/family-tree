<div class="bg-white rounded-xl border border-gray-50 shadow-sm p-4">
  <h2 class="font-semibold text-lg mb-4">Reminders</h2>

  <form hx-post="/reminders" hx-target="#reminders-panel" hx-swap="innerHTML"
        hx-on::after-request="this.reset(); document.body.dispatchEvent(new Event('refreshUpcoming'))"
        class="flex flex-wrap items-end gap-3 mb-6 bg-gray-5 rounded-lg p-3">
    <div>
      <label class="block text-xs font-medium mb-1">Title *</label>
      <input name="title" required placeholder="Anniversary, doctor visit..."
        class="border border-gray-50 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium mb-1">Date *</label>
      <input type="date" name="reminder_date" required class="border border-gray-50 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium mb-1">Related Person</label>
      <select name="person_id" class="border border-gray-50 rounded-lg px-3 py-2 text-sm">
        <option value="">-- None --</option>
        {% for p in people %}
        <option value="{{ p.id }}">{{ p.first_name }} {{ p.last_name or '' }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex items-center gap-1">
      <input type="checkbox" name="repeat_yearly" id="repeat_yearly" checked value="yes">
      <label for="repeat_yearly" class="text-xs">Repeats yearly</label>
    </div>
    <button type="submit" class="bg-wmblue-100 hover:bg-wmblue-110 text-white px-4 py-2 rounded-lg text-sm font-medium">
      + Add Reminder
    </button>
  </form>

  <div class="space-y-2">
    {% for r in reminders %}
    <div class="flex items-center justify-between border border-gray-50 rounded-lg px-3 py-2 text-sm">
      <span>
        🔔 <strong>{{ r.title }}</strong> &middot; {{ r.reminder_date }}
        {% if r.first_name %}&middot; {{ r.first_name }} {{ r.last_name or '' }}{% endif %}
        {% if r.repeat_yearly %}<span class="text-xs text-wmgreen-100">(yearly)</span>{% endif %}
      </span>
      <button hx-delete="/reminders/{{ r.id }}" hx-target="#reminders-panel" hx-swap="innerHTML"
        hx-on::after-request="document.body.dispatchEvent(new Event('refreshUpcoming'))"
        class="text-xs text-wmred-100 hover:underline">Remove</button>
    </div>
    {% endfor %}
    {% if reminders|length == 0 %}
    <p class="text-gray-100 text-sm">No custom reminders yet.</p>
    {% endif %}
  </div>
</div>
