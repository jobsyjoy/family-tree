<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" id="modal-backdrop">
<div class="bg-white rounded-xl p-6 w-full max-w-md shadow-xl">
  <div class="flex justify-between items-center mb-4">
    <h3 class="font-semibold text-lg">{% if person %}Edit{% else %}Add{% endif %} Person</h3>
    <button onclick="document.getElementById('person-form-modal').innerHTML=''" class="text-gray-100 hover:text-gray-160">&times;</button>
  </div>
  <form hx-post="{% if person %}/people/{{ person.id }}{% else %}/people{% endif %}"
        hx-target="#people-list" hx-swap="innerHTML"
        hx-on::after-request="document.getElementById('person-form-modal').innerHTML=''; document.body.dispatchEvent(new Event('refreshPeople')); document.body.dispatchEvent(new Event('refreshUpcoming'))"
        class="space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1">First Name *</label>
      <input name="first_name" required value="{{ person.first_name if person else '' }}"
        class="w-full border border-gray-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wmblue-100">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Last Name</label>
      <input name="last_name" value="{{ person.last_name if person else '' }}"
        class="w-full border border-gray-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wmblue-100">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">Date of Birth</label>
        <input type="date" name="dob" value="{{ person.dob if person else '' }}"
          class="w-full border border-gray-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wmblue-100">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Date of Death</label>
        <input type="date" name="dod" value="{{ person.dod if person else '' }}"
          class="w-full border border-gray-50 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wmblue-100">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Gender</label>
      <select name="gender" class="w-full border border-gray-50 rounded-lg px-3 py-2">
        <option value="">--</option>
        <option value="female" {% if person and person.gender == 'female' %}selected{% endif %}>Female</option>
        <option value="male" {% if person and person.gender == 'male' %}selected{% endif %}>Male</option>
        <option value="other" {% if person and person.gender == 'other' %}selected{% endif %}>Other</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Notes</label>
      <textarea name="notes" rows="2" class="w-full border border-gray-50 rounded-lg px-3 py-2">{{ person.notes if person else '' }}</textarea>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" onclick="document.getElementById('person-form-modal').innerHTML=''"
        class="px-4 py-2 rounded-lg border border-gray-50 text-sm">Cancel</button>
      <button type="submit" class="px-4 py-2 rounded-lg bg-wmblue-100 hover:bg-wmblue-110 text-white text-sm font-medium">
        Save
      </button>
    </div>
  </form>
</div>
</div>
